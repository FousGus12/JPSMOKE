<!doctype html>
<html lang="es-CO" data-direccion="vino">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Panel · JP Smoke</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/panel.css">
<script src="assets/data.js"></script>
</head>
<body>

<!-- Ingreso -->
<section class="login" id="login">
  <form class="login-card" id="login-form" novalidate>
    <span class="logo"><span data-logo></span><b>JP <i>Smoke</i></b></span>
    <h1>Panel del negocio</h1>
    <p class="muted">Acceso solo para el equipo. Las cuentas las crea el administrador.</p>
    <div class="field"><label for="l-mail">Correo</label><input class="input" id="l-mail" type="email" value="admin@jpsmoke.test" autocomplete="username"></div>
    <div class="field"><label for="l-pass">Contraseña</label><input class="input" id="l-pass" type="password" value="JpSmoke-Dev-2026" autocomplete="current-password"></div>
    <div class="field"><label for="l-totp">Código de la app autenticadora</label><input class="input" id="l-totp" inputmode="numeric" maxlength="6" value="482913" autocomplete="one-time-code"><span class="hint">Obligatorio para administrador (TOTP).</span></div>
    <div class="field"><label for="l-role">Entrar como (solo mockup)</label><select class="select" id="l-role"><option value="admin">Administrador</option><option value="operador">Operador de pedidos</option></select></div>
    <button class="btn btn-primary btn-block btn-lg" type="submit">Entrar</button>
    <p class="hint center">Sesión se cierra tras 30 min sin actividad.</p>
  </form>
</section>

<div class="app" id="app" hidden>
  <aside class="side" id="side">
    <a class="logo" href="index.html" target="_blank" rel="noopener" title="Ver el sitio"><span data-logo></span><b>JP <i>Smoke</i></b></a>
    <nav class="side-nav" id="side-nav" aria-label="Panel"></nav>
    <div class="side-foot">
      <div class="who"><span class="avatar" id="who-avatar">A</span><div><b id="who-name">Admin</b><small id="who-role">Administrador · 2FA activo</small></div></div>
      <button class="btn btn-soft btn-sm btn-block" type="button" id="logout">Cerrar sesión</button>
    </div>
  </aside>
  <div class="main">
    <header class="topbar">
      <button class="icon-btn" type="button" id="side-toggle" aria-label="Menú">☰</button>
      <h1 id="view-title">Resumen</h1>
      <div class="topbar-actions">
        <span class="live"><span class="dot"></span> En vivo</span>
        <button class="btn btn-soft btn-sm" type="button" id="bell" aria-pressed="false">🔕 Activar avisos</button>
        <a class="btn btn-soft btn-sm" href="index.html" target="_blank" rel="noopener">Ver sitio ↗</a>
        <button class="btn btn-primary btn-sm" type="button" data-new-order>＋ Pedido manual</button>
      </div>
    </header>
    <main class="view" id="view"></main>
  </div>
</div>

<div class="modal" id="modal" hidden role="dialog" aria-modal="true" aria-labelledby="modal-title">
  <div class="modal-card">
    <header class="modal-head"><h2 id="modal-title"></h2><button class="icon-btn" type="button" data-close aria-label="Cerrar">✕</button></header>
    <div class="modal-body" id="modal-body"></div>
  </div>
</div>
<div class="drawer-r" id="drawer" hidden role="dialog" aria-modal="true" aria-labelledby="drawer-title">
  <header class="modal-head"><h2 id="drawer-title"></h2><button class="icon-btn" type="button" data-close aria-label="Cerrar">✕</button></header>
  <div class="drawer-body" id="drawer-body"></div>
</div>
<div class="backdrop" id="backdrop" hidden></div>

<div class="direccion" role="group" aria-label="Dirección visual del mockup">
  <span>Diseño</span>
  <button type="button" data-dir="brasa">Brasa</button>
  <button type="button" data-dir="vino">Vino</button>
  <button type="button" data-dir="mostaza">Mostaza</button>
</div>
<div class="toasts" id="toasts" aria-live="polite"></div>
<script src="assets/panel.js"></script>
</body>
</html>
