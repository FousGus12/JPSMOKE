name: Falla
description: Algo no funciona como debería en JP Smoke
labels: [falla]
body:
  - type: textarea
    id: que-pasa
    attributes:
      label: Qué pasa
      description: Qué hiciste, qué esperabas y qué pasó. Sin datos de clientes ni claves.
    validations:
      required: true
  - type: dropdown
    id: donde
    attributes:
      label: Dónde
      multiple: true
      options: [PC, Android, iPhone (Safari), iPhone (app instalada), Vista previa de Vercel]
    validations:
      required: true
  - type: input
    id: pantalla
    attributes:
      label: Pantalla
      placeholder: Inicio, Muro Soporte, detalle de tarea…
  - type: textarea
    id: pasos
    attributes:
      label: Pasos para repetirla
      placeholder: "1. …\n2. …"
